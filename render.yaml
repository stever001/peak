# Render Blueprint for the Peak consultant API (Phase 203). No values live here: this repository is
# public. The runtime database URL is entered in the Render dashboard (sync: false) and the session
# signing key is generated by Render. The start command runs the app only; migrations are never run
# at startup. See docs/PHASE203_FIRST_LIVE_DEPLOYMENT.md.
services:
  - type: web
    name: peak-consultant-api
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn --factory peak.consultant_api.app:create_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PEAK_RUNTIME_DATABASE_URL
        sync: false
      - key: PEAK_WEB_SECRET_KEY
        generateValue: true
